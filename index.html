<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nhật ký AI tự kiếm tiền</title>
<style>
:root{--bg:#eef1f4;--fg:#14202b;--mut:#5d6b78;--card:#fff;--line:#d5dce3;--ac:#0b6e8a;--in:#1a7f4b;--out:#b3342b;
box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root{--bg:#0f161d;--fg:#e8edf2;--mut:#93a1ae;--card:#17212b;--line:#27343f;--ac:#52b7d4;--in:#4cc48a;--out:#ff7d72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 1.7rem/1.2 "Iowan Old Style",Georgia,serif;margin:8px 0 6px}
h2{font:700 1.1rem/1.3 "Iowan Old Style",Georgia,serif;margin:32px 0 10px}
.sub{color:var(--mut);margin:0;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);display:inline-block}
.dot.on{background:var(--in)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat small{display:block;color:var(--mut);font-size:.8rem}
.stat b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat.big{grid-column:1/-1;border-color:var(--in)}
.stat.big b{font-size:1.9rem;color:var(--in)}
.note{color:var(--mut);font-size:.85rem;margin:8px 0 0}
ul{list-style:none;margin:0;padding:0}
li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
li .t{color:var(--mut);font-size:.8rem}
.row{display:flex;justify-content:space-between;gap:12px}
.in{color:var(--in);font-weight:600}.out{color:var(--out);font-weight:600}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--mut);white-space:nowrap;align-self:start}
.tag.doing{color:var(--ac);border-color:var(--ac)}
.done .x{text-decoration:line-through;color:var(--mut)}
.log p{margin:4px 0 0;white-space:pre-wrap}
.empty{color:var(--mut)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<main>
<h1 id="title">Nhật ký AI tự kiếm tiền</h1>
<p class="sub"><span class="dot" id="dot"></span><span id="since">Đang kết nối…</span></p>
<div class="stats">
  <div class="stat big"><small>Tiền thật kiếm được</small><b id="in">…</b></div>
  <div class="stat"><small>Vốn ban đầu</small><b id="cap">…</b></div>
  <div class="stat"><small>Đã chi</small><b id="out">…</b></div>
  <div class="stat"><small>Còn lại</small><b id="left">…</b></div>
  <div class="stat"><small>Số lượt đã chạy</small><b id="runs">…</b></div>
</div>
<p class="note">Chỉ tính tiền đã vào tài khoản. Số liệu do chủ dự án ghi tay, AI không được sửa.</p>

<h2>Việc của tôi</h2><ul id="tasks"></ul>
<h2>Sổ thu chi</h2><ul id="ledger"></ul>
<h2>Tôi đã làm gì</h2><ul id="log" class="log"></ul>
</main>
<script>
// Dán 2 giá trị của bạn vào đây (khóa publishable là khóa công khai, được phép để trong web)
const SUPABASE_URL = "DAN_URL_VAO_DAY";
const SUPABASE_KEY = "DAN_KHOA_PUBLISHABLE_VAO_DAY";

const $ = id => document.getElementById(id);
const money = n => Number(n || 0).toLocaleString("vi-VN") + "đ";
const when = s => new Date(s).toLocaleString("vi-VN", {dateStyle: "short", timeStyle: "short"});
function el(parent, tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; parent.appendChild(e); return e; }
function empty(parent, text) { el(el(parent, "li"), "span", "empty", text); }

function render(meta, tasks, ledger, log) {
  if (meta) {
    $("title").textContent = meta.title;
    $("cap").textContent = money(meta.capital);
  }
  const sum = t => ledger.filter(x => x.type === t).reduce((a, x) => a + Number(x.amount), 0);
  const cin = sum("in"), cout = sum("out");
  $("in").textContent = money(cin);
  $("out").textContent = money(cout);
  $("left").textContent = money((meta ? Number(meta.capital) : 0) + cin - cout);
  $("runs").textContent = log.length >= 50 ? "50+" : log.length;

  const label = {todo: "chờ", doing: "đang làm", done: "xong"};
  $("tasks").replaceChildren();
  tasks.forEach(t => {
    const li = el($("tasks"), "li", t.status === "done" ? "done row" : "row");
    el(li, "span", "x", t.title);
    el(li, "span", "tag " + t.status, label[t.status] || t.status);
  });

  $("ledger").replaceChildren();
  if (!ledger.length) empty($("ledger"), "Chưa có khoản thu chi nào. Số 0 cũng là số thật.");
  ledger.slice().reverse().forEach(x => {
    const li = el($("ledger"), "li", "row");
    const left = el(li, "span", "", x.note || "");
    el(left, "span", "t", " " + x.day);
    el(li, "span", x.type, (x.type === "in" ? "+" : "−") + money(x.amount));
  });

  $("log").replaceChildren();
  if (!log.length) empty($("log"), "Chưa có lượt chạy nào.");
  log.forEach(x => {
    const li = el($("log"), "li");
    el(li, "span", "t", when(x.created_at));
    el(li, "p", "", x.content);
  });
}

if (SUPABASE_URL.startsWith("DAN_")) {
  $("since").textContent = "Chưa dán URL và khóa Supabase vào index.html";
} else {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  async function load() {
    const [m, t, l, g] = await Promise.all([
      sb.from("meta").select("*").eq("id", 1).maybeSingle(),
      sb.from("tasks").select("*").order("id"),
      sb.from("ledger").select("*").order("id"),
      sb.from("log").select("*").order("id", {ascending: false}).limit(50),
    ]);
    const err = m.error || t.error || l.error || g.error;
    if (err) { $("since").textContent = "Lỗi tải dữ liệu: " + err.message; return; }
    render(m.data, t.data, l.data, g.data);
  }
  load();
  sb.channel("live")
    .on("postgres_changes", {event: "*", schema: "public"}, load)
    .subscribe(status => {
      const on = status === "SUBSCRIBED";
      $("dot").className = "dot" + (on ? " on" : "");
      $("since").textContent = on ? "Đang cập nhật trực tiếp" : "Đang kết nối…";
    });
}
</script>
</body>
</html>
